name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Validate tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "${version^^}" == *SNAPSHOT* ]]; then
            printf 'Snapshot versions cannot be released: %s\n' "$version" >&2
            exit 1
          fi
      - name: Verify JitPack publication
        run: >-
          ./gradlew clean allTests ktlintCheck apiCheck assemble
          publishToMavenLocal
          -PGROUP=com.github.MetrolistGroup
          -PPOM_ARTIFACT_ID=innertubex
          -PVERSION_NAME="$GITHUB_REF_NAME"
          --no-build-cache
          --no-configuration-cache
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
