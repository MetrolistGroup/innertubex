GROUP=com.github.MetrolistGroup
# Consumed by the Vanniktech publication plugin before publications are finalized.
POM_ARTIFACT_ID=innertubex
VERSION_NAME=v0.11.4

# Kotlin/Native runs inside the Gradle daemon, so cap parallel workers along with its heap.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx3g"
org.gradle.workers.max=8
# Stop idle daemons after 30 minutes instead of three hours.
org.gradle.daemon.idletimeout=1800000
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
